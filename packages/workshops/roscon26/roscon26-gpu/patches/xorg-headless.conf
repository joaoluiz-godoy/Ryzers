# Headless Xorg for O3DE on an AMD iGPU with NO monitor attached.
#
# Why not Xvfb? Xvfb is a dummy framebuffer with no DRM/DRI3, so Vulkan can't
# present ("No DRI3 support detected") and O3DE never finishes starting. A real
# Xorg on the amdgpu DRM node gives GPU rendering AND DRI3 presentation.
#
# AllowEmptyInitialConfiguration lets X start with no connected output (a
# headless server), backed by a virtual framebuffer of the size below.

Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "DontVTSwitch" "true"
EndSection

Section "Device"
    Identifier "AMDGPU0"
    Driver     "amdgpu"
    Option     "DRI" "3"
EndSection

Section "Monitor"
    Identifier "Monitor0"
EndSection

Section "Screen"
    Identifier   "Screen0"
    Device       "AMDGPU0"
    Monitor      "Monitor0"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Virtual 1920 1080
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "Layout0"
    Screen     "Screen0"
    Option     "AllowEmptyInitialConfiguration" "true"
EndSection
